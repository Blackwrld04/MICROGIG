# Render Blueprint for the backend (apps/api) + managed PostgreSQL.
# Render → New → Blueprint → select this repository.
services:
  - type: web
    name: microgig-api
    runtime: node
    rootDir: apps/api
    # dist/ is git-ignored, so compile here; --include=dev keeps tsc even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false # e.g. https://<your-project>.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: microgig-postgres
          property: connectionString
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "2" # Vercel rewrite -> Render load balancer -> API
      - key: REDIS_URL
        sync: false
      # Transactional Email (Resend or Gmail SMTP)
      - key: EMAIL_FROM
        value: MicroGig <notifications@microgig.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "true"
      # S3 / Cloudflare R2 file storage
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BUCKET_NAME
        value: microgig-showcase-public
      - key: S3_PRIVATE_BUCKET_NAME
        value: microgig-deliverables-private
      - key: STORAGE_PUBLIC_URL
        sync: false
      # Business logic constants
      - key: PLATFORM_FEE_BPS
        value: "2000"
      - key: AUTO_COMPLETE_DELAY_HOURS
        value: "72"
      - key: REVISION_DEADLINE_HOURS
        value: "24"
      - key: CLEARING_PERIOD_DAYS
        value: "3"

databases:
  - name: microgig-postgres
    databaseName: microgig
    user: microgig
    plan: free
